<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buku Tamu Digital Kampus</title>
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    input, textarea, button { width: 100%; padding: .6rem; margin: .3rem 0; box-sizing: border-box; }
    button { cursor: pointer; }
    .entry { border: 1px solid #ddd; border-radius: 6px; padding: .8rem; margin: .6rem 0; }
    .entry small { color: #777; }
    .del { width: auto; background: #d9534f; color: #fff; border: 0; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>📖 Buku Tamu Digital Kampus</h1>
  <input id="name" placeholder="Nama">
  <textarea id="message" rows="3" placeholder="Pesan / kesan"></textarea>
  <button id="send">Kirim</button>
  <p id="status"></p>
  <div id="list"></div>

  <script>
    const API = "/api/messages";
    const $ = id => document.getElementById(id);

    async function load() {
      try {
        const res = await fetch(API);
        const data = await res.json();
        $("list").innerHTML = "";
        data.forEach((m, i) => {
          const div = document.createElement("div");
          div.className = "entry";
          const b = document.createElement("b"); b.textContent = m.name;
          const p = document.createElement("p"); p.textContent = m.message;
          const s = document.createElement("small"); s.textContent = m.time;
          const d = document.createElement("button");
          d.className = "del"; d.textContent = "Hapus";
          d.onclick = () => remove(i);
          div.append(b, p, s, document.createElement("br"), d);
          $("list").appendChild(div);
        });
      } catch (e) { $("status").textContent = "Gagal terhubung ke backend"; }
    }

    async function add() {
      const res = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: $("name").value, message: $("message").value })
      });
      if (res.ok) { $("name").value = ""; $("message").value = ""; $("status").textContent = ""; }
      else { $("status").textContent = (await res.json()).error; }
      load();
    }

    async function remove(i) {
      await fetch(`${API}?index=${i}`, { method: "DELETE" });
      load();
    }

    $("send").onclick = add;
    load();
  </script>
</body>
</html>
